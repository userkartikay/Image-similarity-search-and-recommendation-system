services:
  - type: web
    name: stylesearch
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && TORCH_HOME=.torch-cache python -c "from torchvision import models; models.resnet18(weights=models.ResNet18_Weights.DEFAULT)"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TORCH_HOME
        value: .torch-cache
